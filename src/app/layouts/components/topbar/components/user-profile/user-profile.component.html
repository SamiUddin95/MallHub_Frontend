<div class="topbar-item nav-user d-flex align-items-center gap-1">
    <!-- User Name -->
    <div class="d-flex align-items-center">
        <span class="fw-semibold text-muted me-1">Welcome,</span>
        <span class="fw-bold">{{ getUserName() }}</span>
    </div>

    <!-- Logout Button -->
    <button 
        class="btn btn-sm btn-outline-danger me-2 ms-2" 
        (click)="logout()"
        title="Logout">
        <ng-icon name="tablerLogout2" class="me-1"></ng-icon>
        Logout
    </button>
</div>
